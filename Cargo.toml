[package]
name = "roowho2"
version = "0.1.0"
edition = "2024"
resolver = "2"
license = "BSD-4-Clause"
authors = [
  "Programvareverkstedet <projects@pvv.ntnu.no>",
  "The Regents of the University of California",
  "Peter Eriksson, Signum Support AB",
]
description = "A modern reimplementation of netkit tools"
categories = ["command-line-interface", "command-line-utilities"]
readme = "README.md"
autobins = false
autolib = false

[dependencies]
anyhow = "1.0.102"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3.32"
nix = { version = "0.31.2", features = ["hostname", "net", "fs", "user"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# onc-rpc = "0.3.2"
sd-notify = { version = "0.5.0", optional = true }
serde_json = "1.0.149"
uucore = { version = "0.8.0", features = ["utmpx"] }
zlink = { version = "0.4.1", features = ["introspection"] }
clap_complete = "4.6.2"
itertools = "0.14.0"
tokio-util = "0.7.18"
caps = "0.5.6"

[features]
default = ["systemd"]
systemd = ["sd-notify", "uucore/feat_systemd_logind"]

[lib]
name = "roowho2_lib"
path = "src/lib.rs"

[[bin]]
name = "roowhod"
bench = false
path = "src/bin/roowhod.rs"

[[bin]]
name = "finger"
bench = false
path = "src/bin/finger.rs"

# [[bin]]
# name = "rup"
# bench = false
# path = "src/bin/rup.rs"

[[bin]]
name = "ruptime"
bench = false
path = "src/bin/ruptime.rs"

# [[bin]]
# name = "rusers"
# bench = false
# path = "src/bin/rusers.rs"

# [[bin]]
# name = "rwall"
# bench = false
# path = "src/bin/rwall.rs"

[[bin]]
name = "rwho"
bench = false
path = "src/bin/rwho.rs"

[profile.releaselto]
inherits = "release"
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
indoc = "2.0.7"
